name: develop
on:
  push:
    branches:
    - develop/*
  pull_request:
    branches:
    - release/*
  workflow_dispatch:

env:
  JAVAVERSION: 21.0.8
  ZULUVERSION: 21.44.17
  GRADLEVERSION: 9.0.0
    
jobs:
  build:
    runs-on: build
    outputs:
      appversion: ${{steps.buildapplication.outputs.VERS}}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare JDK
        id: preparejava
        run: |
          APP_DIR="${HOME}/.local/programs/java"
          JAVA_PACKAGE=zulu${ZULUVERSION}-ca-fx-jdk${JAVAVERSION}-linux_x64
          JDK_DIR="${APP_DIR}/${JAVA_PACKAGE}"
          if [ ! -d "${JDK_DIR}" ]
          then
              mkdir -p "${JDK_DIR}"
              wget -O "${HOME}/java.tar.gz" -q "https://cdn.azul.com/zulu/bin/${JAVA_PACKAGE}.tar.gz"
              tar -x -f "${HOME}/java.tar.gz" -C "${APP_DIR}"
              rm "${HOME}/java.tar.gz"
          else
              echo "Java ${JAVAVERSION} is already installed."
          fi
          echo "JAVA_HOME=${JDK_DIR}" >> $GITHUB_ENV
      
      - name: Prepare Gradle
        id: preparegradle
        run: |
          BASE_DIR="${HOME}/.local/programs/gradle"
          DIRNAME=gradle-${GRADLEVERSION}
          PACKAGE=${DIRNAME}-bin
          APP_DIR="${BASE_DIR}/${DIRNAME}"
          if [ ! -d "${BASE_DIR}" ]; then mkdir -p "$BASE_DIR"; fi
          if [ ! -d "${APP_DIR}" ]
          then
              wget -O "${HOME}/gradle.zip" -q "https://downloads.gradle.org/distributions/${PACKAGE}.zip"
              unzip -q "${HOME}/gradle.zip" -d "${BASE_DIR}"
              rm "${HOME}/gradle.zip"
          else
              echo "Gradle ${GRADLEVERSION} is already installed."
          fi
          echo "GRADLE_HOME=${APP_DIR}" >> $GITHUB_ENV
      - name: Setting build properties
        run: |
          echo "${{ vars.BUILD_APPLICATION_PROPERTIES }}" > "src/test/resources/application-test.properties"
          cat "src/test/resources/application-test.properties"
      - name: Build application
        id: buildapplication
        run: |
          PATH="${JAVA_HOME}/bin:${GRADLE_HOME}/bin:${PATH}"
          V=$(git rev-parse --abbrev-ref HEAD | sed -E 's/(.*)\/(.*)/\2/g')
          H="$(git rev-parse --short HEAD)"
          VERS="${V}-beta-${H}"
          gradle -Pversion="${VERS}" clean distribute
          echo "VERS=${VERS}" > $GITHUB_ENV
          echo "VERS=${VERS}" > $GITHUB_OUTPUT
      - name: Create archive
        run: |
          ARC="${PWD}/build/dist/tools-${VERS}.tar.gz"
          DIR="${PWD}/build/dist/libs"
          (cd "${DIR}" && tar -czf "${ARC}" *.jar)
      - name: Publish archive
        run: |
          KEYFILE="${HOME}/.ssh/$(uuidgen)"
          KHFILE="${HOME}/.ssh/$(uuidgen)"
          echo "${{ secrets.SSH_FOO_HETZNER }}" > "${KEYFILE}"
          ssh-keyscan "tools.goa.systems" 1> "${KHFILE}" 2> /dev/null
          chmod 600 "${KEYFILE}"
          scp -i "${KEYFILE}" -o UserKnownHostsFile="${KHFILE}" "${PWD}/build/dist/tools-${VERS}.tar.gz" foo@tools.goa.systems:"/var/www/dist/rc/tools-${VERS}.tar.gz"
          rm "${KEYFILE}"
  deploy:
    runs-on: clouddeploy
    needs: build
    env:
      APPLICATIONVERSION:  ${{ needs.build.outputs.appversion }}
    steps:
    - name: Download archive
      run: |
        FILE="/tmp/$(uuidgen).tar.gz"
        wget --quiet -O "${FILE}" "https://dist.goa.systems/rc/tools-${APPLICATIONVERSION}.tar.gz"
        echo "DL_FILE=${FILE}" > $GITHUB_ENV

    - name: Stop service
      run: systemctl stop goa.systems.tools.service

    - name: Extract contents
      run: |
        DIR="${HOME}/.local/programs/goasystems/tools/lib"
        if [ -d "${DIR}" ]; then rm -rf "${DIR}"; fi
        mkdir -p "${DIR}"
        tar -x -f "${DL_FILE}" -C "${DIR}"

    - name: Start service
      run: systemctl start goa.systems.tools.service

    - name: Clanup downloaded archive
      run: |
        rm -f "${DL_FILE}"